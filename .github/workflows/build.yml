name: Збірка Android і сайту

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app:
          - { dir: ".", name: "EKG-Praktykum" }
          - { dir: "paramedic", name: "Paramedyk" }
          - { dir: "bunker", name: "Temnyi-Bunker" }
    defaults:
      run:
        working-directory: ${{ matrix.app.dir }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Підключити Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Встановити залежності і синхронізувати веб-частину
        run: |
          npm ci
          npx cap sync android

      - name: Відновити ключ підпису
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Не додано секрет KEYSTORE_BASE64"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Зібрати AAB (для Google Play) і APK (для встановлення вручну)
        working-directory: ${{ matrix.app.dir }}/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ekg
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Перейменувати файли
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/${{ matrix.app.name }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/${{ matrix.app.name }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-1.0.${{ github.run_number }}
          path: ${{ matrix.app.dir }}/out/*

  release:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Опублікувати в Releases (прямі посилання на .apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Версія 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Прямі посилання (завжди найновіша версія):
            • ЕКГ Практикум — https://github.com/${{ github.repository }}/releases/latest/download/EKG-Praktykum.apk
            • Довідник парамедика — https://github.com/${{ github.repository }}/releases/latest/download/Paramedyk.apk
            • Темний Бункер — https://github.com/${{ github.repository }}/releases/latest/download/Temnyi-Bunker.apk
            Файли .aab — для завантаження в Google Play.
          files: dist/*

  site:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Зібрати сайт (ЕКГ Практикум + Довідник парамедика)
        run: |
          mkdir -p _site
          cp -r www/. _site/
          mkdir -p _site/paramedic
          cp -r paramedic/www/. _site/paramedic/
          mkdir -p _site/bunker
          cp -r bunker/www/. _site/bunker/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
